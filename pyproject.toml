[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmea-agent"
version = "0.0.1"
description = "Maintainable, evidence-grounded, MBSE-aware FMEA Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.11",
    "opensysml==0.4.0",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
demo = [
    "httpx==0.28.1",
    "neo4j==5.28.2",
    "openpyxl==3.1.5",
    "pypdf==6.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fmea_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
